<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}"
      layout:fragment="content">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="/css/markdown.css"/>
    <link rel="stylesheet" href="/css/blog/admonition.css"/>
    <link rel="stylesheet" th:href="@{/css/newArticle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <style>
        .mde-table {
            width: 30px;
        }
    </style>
</head>
<body class="bg-light">

<div class="container my-5 px-xxl-2 pt-4">
    <div class="row">
        <div class="col">
            <h2 th:if="${article.id != null}" class="mb-4">글 수정</h2>
            <h2 th:if="${article.id == null}" class="mb-4">글 등록</h2>
            <article>
                <form class="needs-validation" novalidate>
                    <input type="hidden" id="draft-id">
                    <input type="hidden" id="draft-version">
                    <input type="hidden" id="article-id" th:value="${article.id}">
                    <input th:if="${article.id}" type="hidden" id="article-menuName" th:value="${article.menuName}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <select class="form-select" id="menu" required="required">
                                <option value="">메뉴 선택</option>
                                <option th:each="menu : ${menus.menus}" th:selected="${menu.name.equals(article.menuName)}" th:text="${menu.name}" th:value="${menu.id}">
                                </option>
                            </select>
                            <div class="invalid-feedback">
                                메뉴를 선택해주세요.
                            </div>
                        </div>
                        <div th:if="${article.id} == null" id="draft-box" class="col-md-7 dropdown justify-content-end list-unstyled d-flex">
                            <button type="button" id="reset-button" class="btn btn-secondary btn-sm me-2 init-button" onclick="handleResetForm()">
                                새글 작성하기
                            </button>
                            <button id="draft-button" class="btn btn-primary draft-items-button" type="button" data-bs-toggle="modal" data-bs-target="#draftModal">
                                임시 저장 목록
                            </button>
                        </div>
                    </div>
                    <header class="mb-4">
                        <div class="mb-1">
                            <input type="text" class="form-control" placeholder="제목" id="title" th:value="${article.title}" required>
                            <div class="invalid-feedback">
                                제목은 필수입니다.
                            </div>
                        </div>
                        <div class="mb-0">
                            <input type="text" class="form-control" placeholder="부제목" id="subTitle" th:value="${article.subTitle}">
                        </div>
                    </header>
                    <div class="article-visibility-setting mb-4">
                        <div class="article-visibility-copy">
                            <span class="article-visibility-label">공개 상태</span>
                            <p class="article-visibility-help mb-0">기본값은 비공개이며, 공개로 바꿔야 외부에 노출됩니다.</p>
                        </div>
                        <div class="btn-group article-visibility-toggle" role="group" aria-label="글 공개 상태">
                            <input type="radio" class="btn-check" name="visibility" id="visibility-private" value="PRIVATE"
                                   th:checked="${article.visibility == null or article.visibility.name() == 'PRIVATE'}">
                            <label class="btn article-visibility-option" for="visibility-private">비공개</label>

                            <input type="radio" class="btn-check" name="visibility" id="visibility-public" value="PUBLIC"
                                   th:checked="${article.visibility != null and article.visibility.name() == 'PUBLIC'}">
                            <label class="btn article-visibility-option" for="visibility-public">공개</label>
                        </div>
                    </div>
                    <div class="mb-4 d-flex align-items-center gap-2">
                        <button type="button" id="thumbnail-upload-btn" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#thumbnailSelectModal">썸네일 업로드</button>
                        <span id="selected-thumbnail-name" class="text-muted small" th:text="${article.thumbnailLogicalName}"></span>
                    </div>
                    <section class="mb-5 markdown-body">
                        <textarea class="form-control h-25" rows="10" placeholder="내용" id="content"
                                  th:text="${article.content}"></textarea>
                    </section>
                    <button th:if="${article.id} == null" type="button" id="draft-btn" class="btn btn-secondary btn-sm">임시 저장
                    </button>
                    <button th:if="${article.id} != null" type="button" id="modify-btn" class="btn btn-primary btn-sm">수정
                    </button>
                    <button th:if="${article.id} == null" type="button" id="create-btn" class="btn btn-primary btn-sm">등록
                    </button>
                </form>
            </article>
        </div>
    </div>
</div>

<div id="modalContainer" th:insert="~{blog/modal/draftArticlesModal}">
</div>
<!-- Thumbnail Select Modal -->
<div class="modal fade" id="thumbnailSelectModal" tabindex="-1" aria-labelledby="thumbnailSelectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="thumbnailSelectModalLabel">썸네일 이미지 업로드</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="thumbnail-grid" id="thumbnail-grid">
                    <button type="button" class="thumb-item thumb-plus" id="thumb-plus" aria-label="새 썸네일 업로드">
                        <div class="thumb-plus-icon">+</div>
                    </button>
                    <div class="thumb-item" th:each="thumb : ${thumbnails}" th:data-filename="${thumb}" th:title="${thumb}">
                        <img th:src="@{'/images/thumbnails/' + ${thumb}}" alt="thumbnail" class="thumb-img">
                        <div class="thumb-check d-none">✓</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" id="thumbnail-select-confirm">확인</button>
            </div>
        </div>
    </div>
    <input type="file" id="thumb-file-input" accept="image/png, image/jpeg" class="d-none">
    <input type="hidden" id="selected-thumbnail-hidden" th:value="${article.thumbnailUrl}">
    <input type="hidden" id="selected-thumbnail-name-hidden" th:value="${article.thumbnailLogicalName}">
</div>

<!-- Cropper Modal -->
<div class="modal fade" id="cropperModal" tabindex="-1" aria-labelledby="cropperModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="cropperModalLabel">이미지 자르기</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="cropper-image" src="" alt="Crop target"/>
                <div class="cropper-container">

                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="cropper-done-btn">완료</button>
            </div>
        </div>
    </div>
</div>
<script src="/js/domain/blog/newArticle.js"></script>
<script src="/js/domain/blog/easyMDE.js"></script>
<script src="/js/admonition.js"></script>
<script src="/js/domain/blog/cropper.js"></script>
<script th:inline="javascript">
    const content = /*[[${article.content}]]*/;
</script>
</body>
