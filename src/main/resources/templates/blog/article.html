<!DOCTYPE html>
<html data-theme="light"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}"
      layout:fragment="content">
<th:block layout:fragment="head">
    <link rel="stylesheet" href="/css/markdown.css"/>
    <link rel="stylesheet" href="/css/blog/admonition.css"/>
    <link rel="stylesheet" th:href="@{/css/article.css}">
</th:block>
<body class="bg-light blog-sidebar-page">
<div class="container my-5 px-xxl-2 pt-4">
    <div class="row flex-lg-row-reverse d-lg-grid content">
        <aside class="offcanvas-body p-4 pt-0 p-lg-2" th:insert="~{blog/blogSidebar}"
               th:with="articles=${articles}"></aside>
        <main class="main blog-page-main">
            <div class="blog-page-shell">
                <div class="row mb-3">
                    <div class="col">
                        <article class="article-reading">
                            <input type="hidden" id="article-id" th:value="${article.id}">
                            <header class="p-3 mb-6 page-fade-in blog-page-header">
                                <span sec:authorize="isAuthenticated()"
                                      th:if="${article.visibility != null and article.visibility.name() == 'PRIVATE'}"
                                      class="article-status-badge article-status-badge-private article-detail-private-badge">
                                    <i class="bi bi-lock-fill"></i>  비공개
                                </span>
                                <div class="my-4 w-100 text-center text-wrap">
                                    <h1 class="fw-bolder text-wrap" th:utext="${article.title}"></h1>
                                </div>
                                <h5 class="mb-5 text-center text-secondary" th:text="${article.subTitle}"></h5>
                                <div class="article-meta-row text-muted d-flex flex-wrap align-items-center gap-2">
                                    <div class="article-meta-group d-flex flex-wrap align-items-center gap-2">
                                        <span class="username meta-item" th:text="|${article.author}|"></span>
                                        <span class="createdAt meta-item" th:text="|${#temporals.format(article.createdAt, 'yyyy년 MM월 dd일')}|"></span>
                                        <span class="updatedAt meta-item" th:text="|${#temporals.format(article.updatedAt, 'yyyy년 MM월 dd일')} 수정됨|"></span>
                                    </div>
                                    <div sec:authorize="isAuthenticated()" class="article-actions d-flex ms-auto gap-2"
                                         th:if="${#authentication.principal.getName().equals(article.author())} ">
                                        <button type="button" id="modify-btn"
                                                class="btn btn-primary btn-sm">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button type="button" id="delete-btn"
                                                class="btn btn-secondary btn-sm">
                                            <i class="fa-regular fa-trash-can"></i>
                                        </button>
                                    </div>
                                </div>
                            </header>
                            <section th:if="${article.visibility == null or article.visibility.name() != 'PRIVATE'}" class="mb-5 markdown-body">
                                <div class="mb-4 article-min-height" th:utext="${article.content}">

                                </div>
                            </section>
                            <section sec:authorize="isAuthenticated()"
                                     th:if="${article.visibility != null and article.visibility.name() == 'PRIVATE' and #authentication.principal.getName().equals(article.author())}"
                                     class="mb-5 markdown-body">
                                <div class="mb-4 article-min-height" th:utext="${article.content}">

                                </div>
                            </section>
                            <section sec:authorize="!isAuthenticated()"
                                     th:if="${article.visibility != null and article.visibility.name() == 'PRIVATE'}"
                                     class="mb-5 article-restricted-state">
                                <div class="article-restricted-card">
                                    <div class="article-restricted-icon" aria-hidden="true">
                                        <i class="bi bi-lock-fill"></i>
                                    </div>
                                    <h2 class="article-restricted-title">비공개 글입니다</h2>
                                    <p class="article-restricted-description mb-0">
                                        이 글은 권한이 있는 사용자만 볼 수 있습니다. 현재 계정으로는 내용을 확인할 수 없습니다.
                                    </p>
                                </div>
                            </section>
                            <section sec:authorize="isAuthenticated()"
                                     th:if="${article.visibility != null and article.visibility.name() == 'PRIVATE' and !#authentication.principal.getName().equals(article.author())}"
                                     class="mb-5 article-restricted-state">
                                <div class="article-restricted-card">
                                    <div class="article-restricted-icon" aria-hidden="true">
                                        <i class="bi bi-lock-fill"></i>
                                    </div>
                                    <h2 class="article-restricted-title">비공개 글입니다</h2>
                                    <p class="article-restricted-description mb-0">
                                        이 글은 권한이 있는 사용자만 볼 수 있습니다. 현재 계정으로는 내용을 확인할 수 없습니다.
                                    </p>
                                </div>
                            </section>
                        </article>
                    </div>
                </div>

                <div id="prev-next-card" class="row mb-5">
                    <div class="col">
                        <a th:if="${prevNextArticle.isPrev}"
                           class="card border-0 mb-2 link-underline link-underline-opacity-0"
                           th:href="|/blog/${article.menuName}/${prevNextArticle.prevId}|">
                            <div class="card-body d-flex flex-column align-items-start">
                                <span class="pn-label">이전 글</span>
                                <h6 class="text-truncate" th:text="${prevNextArticle.prevTitle}"></h6>
                            </div>
                        </a>
                        <a th:if="${not prevNextArticle.isPrev}"
                           class="card border-0 mb-2 link-underline link-underline-opacity-0">
                            <div class="card-body d-flex flex-column align-items-start">
                                <span class="pn-label">이전 글</span>
                                <h6 class="text-truncate" th:text="${prevNextArticle.prevTitle}"></h6>
                            </div>
                        </a>
                    </div>
                    <div class="col d-flex justify-content-end">
                        <a th:if="${prevNextArticle.isNext}"
                           class="card border-0 mb-2 link-underline link-underline-opacity-0"
                           th:href="|/blog/${article.menuName}/${prevNextArticle.nextId}|">
                            <div class="card-body d-flex flex-column align-items-end">
                                <span class="pn-label">다음 글</span>
                                <h6 class="text-truncate w-100 text-end" th:text="${prevNextArticle.nextTitle}"></h6>
                            </div>
                        </a>
                        <a th:if="${not prevNextArticle.isNext}"
                           class="card border-0 mb-1 link-underline link-underline-opacity-0">
                            <div class="card-body d-flex flex-column align-items-end">
                                <span class="pn-label">다음 글</span>
                                <h6 class="text-truncate w-100 text-end" th:text="${prevNextArticle.nextTitle}"></h6>
                            </div>
                        </a>
                    </div>
                </div>

                <div th:if="${article.visibility == null or article.visibility.name() != 'PRIVATE'}" class="row border-top pt-5">
                    <div class="col md-5">
                        <h2>Comments</h2>
                    </div>
                    <script src="https://utteranc.es/client.js"
                            repo="dustjq1004/comments"
                            issue-term="pathname"
                            theme="github-light"
                            label="comments"
                            crossorigin="anonymous"
                            async>
                    </script>
                </div>
                <div sec:authorize="isAuthenticated()"
                     th:if="${article.visibility != null and article.visibility.name() == 'PRIVATE' and #authentication.principal.getName().equals(article.author())}"
                     class="row border-top pt-5">
                    <div class="col md-5">
                        <h2>Comments</h2>
                    </div>
                    <script src="https://utteranc.es/client.js"
                            repo="dustjq1004/comments"
                            issue-term="pathname"
                            theme="github-light"
                            label="comments"
                            crossorigin="anonymous"
                            async>
                    </script>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Mobile Article Actions FAB -->
<div sec:authorize="isAuthenticated()"
     th:if="${#authentication.principal.getName().equals(article.author())}"
     id="article-fab" class="article-fab">
    <button type="button" id="article-fab-toggle" class="article-fab-toggle"
            aria-label="게시글 액션 메뉴" aria-expanded="false">
        <i class="bi bi-three-dots-vertical"></i>
    </button>
    <div id="article-fab-menu" class="article-fab-menu">
        <button type="button" id="mobile-modify-btn" class="article-fab-item">
            <i class="fa-solid fa-pen"></i>
            <span>수정</span>
        </button>
        <button type="button" id="mobile-delete-btn" class="article-fab-item article-fab-item-danger">
            <i class="fa-regular fa-trash-can"></i>
            <span>삭제</span>
        </button>
    </div>
</div>

<script src="/js/domain/blog/article.js"></script>
<script src="/js/domain/blog/blog-sidebar.js"></script>
<script src="/js/admonition.js"></script>
<script src="/js/markdown.js"></script>
</body>
