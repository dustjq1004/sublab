<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}"

<head>
    <title>SupLab - Blog</title>
    <link rel="stylesheet" th:href="@{/css/article.css}">
    <link rel="stylesheet" th:href="@{/css/blog/skeleton-loading.css}">

<body class="blog-sidebar-page">
<div class="container my-5 px-xxl-2 pt-4">

    <div class="row flex-lg-row-reverse d-lg-grid content">
        <div class="offcanvas-body p-4 pt-0 p-lg-2" th:insert="~{blog/blogSidebar}" th:with="articles=${articles}">
        </div>
        <div id="main" class="main blog-page-main">
            <div class="blog-page-shell">
                <div class="position-relative p-lg-2 mb-3 page-fade-in blog-page-header">
                    <div class="blog-menu-title">
                        <span class="blog-menu-quote">"</span>
                        <span th:if="${menu != null}" class="blog-menu-name" th:text="${menu.name}"></span>
                        <span th:if="${menu == null}" class="blog-menu-name">전체보기</span>
                        <span class="blog-menu-quote">"</span>
                    </div>
                    <div th:if="${menu != null}" class="blog-menu-sub-title mb-5">
                        <span th:if="${menu.description != null}" th:text="${menu.description}"></span>
                        <span th:if="${menu.description == null}" th:text="${wiseSaying}"></span>
                    </div>
                    <div th:if="${menu == null}" class="blog-menu-sub-title mb-5">
                        <span th:text="${wiseSaying}"></span>
                    </div>
                </div>

                <div class="row search-container mb-6 page-fade-in blog-page-search">
                    <div class="col-12 col-md-8 mx-auto">
                        <div class="blog-search-group">
                            <input type="text" id="blog-search-input" class="blog-search-input" placeholder="검색어를 입력하세요">
                            <button type="button" id="blog-search-btn" class="blog-search-btn">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="article-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xxl-3 gy-3 gx-2">
