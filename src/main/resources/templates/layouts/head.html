<head th:fragment="head">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Sup Lab'"></title>
    <meta property="title" th:content="${title} ?: 'Sup Lab'"/>

          th:content="${#strings.isEmpty(description) ? 'Sup Lab - 기술 블로그' : description}"/>
    <meta property="og:title" th:content="${title} ?: 'Sup Lab'"/>

          th:content="${#strings.isEmpty(description) ? 'Sup Lab - 기술 블로그' : description}"/>
    <meta property="og:type" th:content="${#strings.isEmpty(type) ? 'website' : type}"/>
