<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{index}"
      layout:fragment="content">
<head>
    <title>403 - 접근 권한이 없습니다 | SupLab</title>
    <link rel="stylesheet" th:href="@{/css/error-common.css}">
</head>
<body>
<div class="error-container position-relative">
    <div class="particles" id="particles"></div>
    <div class="error-content">
        <div class="error-illustration">
            <i class="bi bi-shield-exclamation error-icon"></i>
        </div>
        <div class="error-code">403</div>
        <h1 class="error-title">접근 권한이 없습니다</h1>
        <p class="error-message">
            요청하신 페이지에 접근할 권한이 없습니다.<br>
            로그인하시거나 관리자에게 문의하시기 바랍니다.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary btn-home">
                <i class="bi bi-house-door me-2"></i>홈으로 가기
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary btn-back">
                <i class="bi bi-arrow-left me-2"></i>이전 페이지
            </button>
        </div>
    </div>
</div>

<script th:src="@{/js/error-common.js}"></script>
</body>
</html>
