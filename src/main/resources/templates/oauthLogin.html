<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SupLab - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/login-common.css">
</head>
<body class="gradient-custom">
<section class="d-flex vh-100 login-section">
    <div class="container-fluid row justify-content-center align-content-center login-wrap">
        <div class="card bg-dark login-card">
            <div class="card-body p-5 text-center login-card-body">
                <h2 class="text-white oauth-login-title">LOGIN</h2>
                <p class="text-white-50 mt-2 mb-5 oauth-login-desc">서비스 사용을 위해 로그인을 해주세요!</p>
                <div class="mb-2">
                    <a href="/oauth2/authorization/google" class="oauth-login-link">
                        <img src="/img/google.png" class="oauth-login-img" alt="Google 로그인">
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
