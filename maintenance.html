<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 점검 중</title>
    <style>
        :root {
            --maintenance-bg:
                radial-gradient(circle at top left, rgba(106, 17, 203, 0.18), transparent 32%),
                radial-gradient(circle at bottom right, rgba(99, 179, 237, 0.2), transparent 30%),
                linear-gradient(135deg, #f8f5ff 0%, #f6f8fc 48%, #eef4ff 100%);
            --panel-bg: rgba(255, 255, 255, 0.82);
            --panel-border: rgba(106, 17, 203, 0.12);
            --panel-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            --text-main: #111827;
            --text-sub: #6b7280;
            --accent: #6a11cb;
            --accent-soft: rgba(106, 17, 203, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Noto Sans KR", sans-serif;
            color: var(--text-main);
            background: var(--maintenance-bg);
        }

        .maintenance-card {
            width: min(100%, 640px);
            padding: 40px 34px;
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            background: var(--panel-bg);
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(16px);
            text-align: center;
        }

        .maintenance-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 18px 0 12px;
            font-size: clamp(32px, 6vw, 48px);
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        p {
            margin: 0;
            color: var(--text-sub);
            font-size: 16px;
            line-height: 1.8;
        }

        .maintenance-meta {
            margin-top: 28px;
            padding: 18px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(106, 17, 203, 0.08);
        }

        .maintenance-meta strong {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .maintenance-footnote {
            margin-top: 22px;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .maintenance-card {
                padding: 32px 22px;
                border-radius: 22px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
<main class="maintenance-card">
    <div class="maintenance-badge">Maintenance</div>
    <h1>현재 서비스 점검 중입니다</h1>
    <p>
        더 안정적인 서비스 제공을 위해 시스템 점검을 진행하고 있습니다.<br>
        작업이 완료되는 대로 서비스를 다시 이용하실 수 있습니다.
    </p>

    <section class="maintenance-meta">
        <strong>안내</strong>
        <p>잠시 후 다시 접속해 주세요. 이용에 불편을 드려 죄송합니다.</p>
    </section>

    <p class="maintenance-footnote">SUP BLOG</p>
</main>
</body>
</html>
